name: Validate workstream admission

on:
  issues:
    types: [opened, reopened]
  pull_request:
    paths:
      - "scripts/validate_workstream_admission.py"
      - "scripts/test_validate_workstream_admission.py"
      - ".github/workflows/validate-workstream-admission.yml"
      - "AI_INSTRUCTIONS.md"
      - "WORKER_BOOTSTRAP.md"

permissions:
  contents: read
  issues: read

jobs:
  admission:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate workstream admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_workstream_admission.py --event "$GITHUB_EVENT_PATH"
      - name: Run deterministic admission regressions
        run: python3 scripts/test_validate_workstream_admission.py

  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run deterministic admission regressions
        run: python3 scripts/test_validate_workstream_admission.py
