name: AI collaborative task
description: Create a task that can be claimed and handed off between AI agents
title: "[TASK] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issue body + GitHub-created Issue comments are the collaboration source of truth. `protocol/GITHUB_PROTOCOL.md` is canonical. Agents must CLAIM and post-CLAIM replay before implementation, then append canonical work events with fresh idempotency keys.
  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: Parent/meta Issue, if any (for example #1)
      placeholder: "#1"
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the outcome, not an implementation guess.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: Files, code, docs, PRs, or other artifacts expected.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / trust boundaries
      description: Include write scope, external-system limits, privacy/security rules, and forbidden assumptions.
      placeholder: "GitHub is source of truth; do not store secrets in Issues/comments."
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / required capabilities
      description: List prerequisite Issues and capabilities such as github, coding, browser, research.
      placeholder: "Dependencies: none\nCapabilities: github, coding"
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions another agent can verify.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Agent protocol
        Before implementation, read current `AI_INSTRUCTIONS.md`, parent/Manager directives, and `protocol/GITHUB_PROTOCOL.md`; fetch the complete Issue comment history; replay canonical state; post a fresh-key structured `CLAIM` only when open; then fetch/replay again. Begin implementation only if your CLAIM is the live winner. HANDOFF does not release ownership; append RELEASE when relinquishing immediately.
