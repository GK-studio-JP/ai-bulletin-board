name: Deploy bulletin board Pages
on:
  push:
    branches: [main]
    paths: ['pages/**', 'scripts/build_pages_projection.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: Build sanitized GitHub-native projection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_pages_projection.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
