name: Deploy bulletin board Pages
on:
  pull_request:
    paths:
      - 'pages/**'
      - 'scripts/test_productization_phase2_console.py'
      - 'scripts/build_pages_projection.py'
      - 'scripts/test_build_pages_projection.py'
      - 'scripts/autonomy_ops.py'
      - 'scripts/validate_product_ux_contract.py'
      - 'data/product-ux-e2e/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'scripts/build_pages_projection.py'
      - 'scripts/test_build_pages_projection.py'
      - 'scripts/autonomy_ops.py'
      - 'scripts/validate_product_ux_contract.py'
      - 'data/product-ux-e2e/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions: {}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-production' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run projection replay regressions
        run: python3 scripts/test_build_pages_projection.py
      - name: Run Productization Phase-2B console regressions
        run: python3 scripts/test_productization_phase2_console.py
      - name: Derive sanitized autonomy snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/autonomy_ops.py --output /tmp/autonomy.json
      - name: Build sanitized GitHub-native projection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_pages_projection.py --autonomy-input /tmp/autonomy.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
